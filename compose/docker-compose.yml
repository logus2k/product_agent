services:
  product-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    image: product-agent:0.1.0
    container_name: product-agent
    restart: unless-stopped
    # host networking like the other agents: listens on :7809, reaches the model (:8500), reqoach
    # (:7802) and the Analyst relay (:7803) on localhost.
    # Run as the host user, not root. These services write into the shared project
    # repos; as root they leave root-owned artifacts that any agent running as the
    # host user then cannot overwrite (this broke the deploy agent's Dockerfile
    # write). None of them needs root — no docker.sock, no privileged port.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    network_mode: host
    environment:
      PROJECT_REPOS_ROOT: "/app/project-repos"       # the shared repo tree (reads requirements/, writes product/)
      PRODUCT_LLM_URL: "http://127.0.0.1:8500"        # the active chat model (llama.cpp), same as the builder
      REQOACH_URL: "http://localhost:7802"            # commit the product area (BFF owns git)
      FACTORY_RELAY_URL: "http://localhost:7803"       # Analyst socket.io hub (live Product lane)
    volumes:
      - ../data:/app/data
      - /home/logus/env/project-repos:/app/project-repos
